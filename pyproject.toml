[project]
name = "wine-hack-scanner"
version = "0.1.0"
description = "Reproducible Russian wine bottle scanner for the RSHB hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "easyocr==1.7.2",
    "fastapi==0.115.12",
    "huggingface-hub==1.33.0",
    "httpx==0.28.1",
    "numpy==2.2.4",
    "opencv-python-headless==5.0.0.93",
    "pandas==2.2.3",
    "pi-heif==1.4.0",
    "pillow==11.1.0",
    "python-multipart==0.0.20",
    "rapidfuzz==3.14.3",
    "safetensors==0.8.0",
    "scikit-image==0.26.0",
    "shapely==2.1.2",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "transformers==5.17.0",
    "unidecode==1.4.0",
    "uvicorn==0.34.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
audit = [
    "httpx[socks]==0.28.1",
]
train = [
    "ultralytics>=8.4,<8.5",
]
